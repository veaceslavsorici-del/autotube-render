build:
  gpu: false
  cuda: "12.1"
  python_version: "3.11"
  system_packages:
    - "ffmpeg"
    - "wget"
    # Fonts for libass — the subtitles filter renders nothing without an installed
    # font. fontconfig substitutes any requested family to one of these.
    - "fontconfig"
    - "fonts-liberation"
    - "fonts-dejavu-core"
  python_packages:
    - "requests==2.32.3"

predict: "predict.py:Predictor"
